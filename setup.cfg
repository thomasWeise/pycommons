[metadata]
name = pycommons
version = attr: pycommons.version.__version__
description = A package with utility functionality for Python projects.
long_description = file: README.md
long_description_content_type = text/markdown
keywords =
    utilities
license = GPL 3.0
license_file = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Natural Language :: English
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
url = https://thomasweise.github.io/pycommons
author = Thomas Weise
author_email = tweise@ustc.edu.cn
maintainer = Thomas Weise
maintainer_email = tweise@ustc.edu.cn
project_urls =
    Documentation = https://thomasweise.github.io/pycommons
    Source = https://github.com/thomasWeise/pycommons/
    Tracker = https://github.com/thomasWeise/pycommons/issues

[options]
include_package_data = True
packages = find:
python_requires = >= 3.12
zip_safe = False
install_requires =
    psutil >= 7.2.2

[options.extras_require]
dev =
    autoflake >= 2.4.0
    bandit >= 1.9.4
    certifi >= 2026.7.22
    coverage >= 7.16.2
    dlint >= 0.16.0
    dodgy >= 0.2.1
    flake8 >= 7.4.1
    flake8-2020 >= 1.8.1
    flake8-absolute-import >= 1.0.0.3
    flake8-bugbear >= 26.9.30
    flake8-builtins >= 3.1.0
    flake8-commas >= 4.0.0
    flake8-comprehensions >= 3.17.0
    flake8-docstrings >= 1.7.0
    flake8-eradicate >= 1.5.0
    flake8-length >= 0.3.1
    flake8-mutable >= 1.2.0
#    flake8-pie >= 0.16.0
#    flake8-printf-formatting >= 1.1.2
    flake8-pyi >= 26.5.0
    flake8-pytest-style >= 2.2.0
    flake8-use-fstring >= 1.4
    markdown >= 3.11
    minify_html >= 0.18.1
    mypy >= 2.4.0
    myst-parser >= 5.1.0
    pycodestyle >= 2.15.0
    pydocstyle >= 6.3.0
    pyflakes >= 4.0.2
    pylint >= 4.1.2
    pyrefly >= 1.3.2
    pyroma >= 5.0.1
    pytest >= 9.1.1
    pytest-timeout >= 2.4.0
    ruff >= 0.16.10
    setuptools >= 84.0.0
    sphinx >= 9.1.0
    sphinx-autodoc-typehints >= 3.13.9
    testresources >= 2.1.2
    tryceratops >= 2.4.1
    twine >= 7.0.0
#    unimport >= 0.11.1
    urllib3 >= 2.8.0
    virtualenv >= 21.14.5
    vulture >= 2.16
    wheel >= 0.48.0

[options.package_data]
pycommons = py.typed

[options.packages.find]
exclude =
    .coverage*
    .github*
    .mypy_cache*
    .pytest_cache*
    .ruff_cache*
    dist*
    docs*
    examples*
    pycommons.egg-info*
    tests*
